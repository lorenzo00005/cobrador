services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: "3000"
      STATE_FILE: /data/state.json
    volumes:
      - state:/data
      # Historial de conversaciones. "workflows" (el anterior) quedó trabado por una imagen en el chat;
      # se conserva intacto como respaldo y se arranca con uno limpio.
      - chats:/app/.eve/.workflow-data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:3000
    depends_on: [app]
    restart: unless-stopped

  webhook:
    image: curlimages/curl:latest
    env_file: .env
    depends_on: [tunnel]
    volumes:
      - ./scripts/register-webhook.sh:/register.sh:ro
    entrypoint: ["sh", "/register.sh"]

volumes:
  state:
  workflows:
  chats:
